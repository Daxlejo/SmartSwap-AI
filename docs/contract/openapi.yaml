      summary: Confirm delivery and finalize a confirmed circular swap route, updating items and eco metrics
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Updated or finalized COMPLETED swap route
        '401':
          description: Unauthorized
        '403':
          description: Not a route participant
        '404':
          description: Swap route not found
        '409':
          description: Route is not in CONFIRMED state
      tags:
        - Routes
      security:
        - bearerAuth: []
  /api/v1/proposals:
    get:
      operationId: ProposalsController_listMyRoutes
      summary: List all barter proposals where the authenticated user is initiator or participant
      parameters: []
      responses:
        '200':
          description: User swap route proposals ordered by updatedAt DESC
        '401':
          description: Unauthorized
      tags:
        - proposals
      security:
        - bearerAuth: []
    post:
      operationId: ProposalsController_proposeRoute
      summary: Create exchange proposal, lock involved items, and notify participants
      parameters: []
      responses:
        '201':
          description: Persisted swap route proposal with locked items
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '409':
          description: One or more items are already locked in another proposal
      tags:
        - proposals
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                objectiveText:
                  type: string
                  minLength: 2
                  maxLength: 200
                matchScore:
                  type: number
                  minimum: 0
                  maximum: 100
                aiExplanation:
                  type: string
                  maxLength: 2000
                steps:
                  type: array
                  items:
                    type: object
                    properties:
                      stepOrder:
                        type: integer
                        minimum: 0
                        maximum: 10
                      userId:
                        type: string
                        minLength: 1
                      givesItemId:
                        type: string
                        minLength: 1
                      receivesItemId:
                        type: string
                        minLength: 1
                    required:
                      - stepOrder
                      - userId
                      - givesItemId
                      - receivesItemId
                    additionalProperties: false
                  minItems: 2
                  maxItems: 4
              required:
                - objectiveText
                - matchScore
                - steps
              additionalProperties: false
  /api/v1/proposals/{id}:
    get:
      operationId: ProposalsController_getRouteById
      summary: Get a single proposal by route ID or human-readable SW-XXXX code
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Swap route proposal detail
        '401':
          description: Unauthorized
        '404':
          description: Swap route proposal not found
      tags:
        - proposals
      security:
        - bearerAuth: []
  /api/v1/proposals/{id}/respond:
    post:
      operationId: ProposalsController_respondToRoute
      summary: Accept or reject a proposed swap route step with distributed consensus transitions
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Updated swap route proposal after recording decision
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Not a route participant
        '404':
          description: Swap route proposal not found
        '409':
          description: Route is not in PROPOSED state
      tags:
        - proposals
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision:
                  type: string
                  enum:
                    - ACCEPTED
                    - REJECTED
                comment:
                  type: string
                  maxLength: 500
              required:
                - decision
              additionalProperties: false
  /api/v1/proposals/{id}/cancel:
    post:
      operationId: ProposalsController_cancelRoute
      summary: Cancel a pending swap route proposal (initiator only) and unlock its items
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Cancelled swap route
        '401':
          description: Unauthorized
        '403':
          description: Not the route initiator
        '404':
          description: Swap route not found
        '409':
          description: Route is no longer pending
      tags:
        - proposals
      security:
        - bearerAuth: []
  /api/v1/proposals/{id}/complete:
    post:
      operationId: ProposalsController_completeRoute
      summary: Confirm delivery and finalize a confirmed circular swap route proposal
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Completed or updated swap route proposal
        '401':
          description: Unauthorized
        '403':
          description: Not a route participant
        '404':
          description: Swap route proposal not found
        '409':
          description: Route is not in CONFIRMED state
      tags:
        - proposals
      security:
        - bearerAuth: []
  /api/v1/notifications:
    get:
      operationId: NotificationsController_listUserNotifications
      summary: List user notifications with unread count
      parameters:
        - name: limit
          required: false
          in: query
          description: Maximum items to return (default 50)
          schema:
            type: number
        - name: unreadOnly
          required: false
          in: query
          description: Filter by unread notifications only
          schema:
            type: boolean
      responses:
        '200':
          description: List of notifications and total unread count
        '401':
          description: Unauthorized
      tags:
        - Notifications
      security:
        - bearerAuth: []
  /api/v1/notifications/unread-count:
    get:
      operationId: NotificationsController_getUnreadCount
      summary: Get total unread notifications count
      parameters: []
      responses:
        '200':
          description: Unread count object
        '401':
          description: Unauthorized
      tags:
        - Notifications
      security:
        - bearerAuth: []
  /api/v1/notifications/read-all:
    post:
      operationId: NotificationsController_markAllAsReadPost
      summary: Mark all unread notifications as read (POST)
      parameters: []
      responses:
        '200':
          description: Updated count and remaining unread count
        '401':
          description: Unauthorized
      tags:
        - Notifications
      security:
        - bearerAuth: []
    patch:
      operationId: NotificationsController_markAllAsReadPatch
      summary: Mark all unread notifications as read (PATCH)
      parameters: []
      responses:
        '200':
          description: Updated count and remaining unread count
        '401':
          description: Unauthorized
      tags:
        - Notifications
      security:
        - bearerAuth: []
  /api/v1/notifications/{id}/read:
    patch:
      operationId: NotificationsController_markAsReadPatch
      summary: Mark a notification as read (PATCH)
      parameters:
        - name: id
          required: true
          in: path
          description: Notification ID
          schema:
            type: string
      responses:
        '200':
          description: Updated notification DTO and remaining unread count
        '401':
          description: Unauthorized
        '404':
          description: Notification not found
      tags:
        - Notifications
      security:
        - bearerAuth: []
    post:
      operationId: NotificationsController_markAsReadPost
      summary: Mark a notification as read (POST)
      parameters:
        - name: id
          required: true
          in: path
          description: Notification ID
          schema:
            type: string
      responses:
        '200':
          description: Updated notification DTO and remaining unread count
        '401':
          description: Unauthorized
        '404':
          description: Notification not found
      tags:
        - Notifications
      security:
        - bearerAuth: []
  /api/v1/notifications/{id}:
    delete:
      operationId: NotificationsController_deleteNotification
      summary: Delete a notification
      parameters:
        - name: id
          required: true
          in: path
          description: Notification ID
          schema:
            type: string
      responses:
        '200':
          description: Notification deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: Notification not found
      tags:
        - Notifications
      security:
        - bearerAuth: []
