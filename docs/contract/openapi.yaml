openapi: 3.1.0
info:
  title: SmartSwap API
  description: Base OpenAPI 3.1 specification for the SmartSwap circular bartering platform.
  version: 1.0.0
  contact:
    name: SmartSwap Engineering Team
    email: dev@smartswap.io

servers:
  - url: http://localhost:3000/api/v1
    description: Local Development Server
  - url: https://api.smartswap.io/v1
    description: Production Server

tags:
  - name: Health
    description: Service health and readiness endpoints
  - name: Auth
    description: User authentication, registration, and session management
  - name: Items
    description: Catalog, inventory, and barter item management
  - name: Routes
    description: Multi-hop circular barter route discovery and management
  - name: Notifications
    description: Real-time and persistent user notifications
  - name: Proposals
    description: Barter and circular exchange proposals

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check probe
      description: Returns service operational status, uptime, and timestamp.
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      description: Creates a new user profile and returns authentication credentials.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags:
        - Auth
      summary: Authenticate user
      description: Validates user credentials and issues JWT access and refresh tokens.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh authentication tokens
      description: Exchange a valid refresh token for a new access token.
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenDto'
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/me:
    get:
      tags:
        - Auth
      summary: Get current authenticated user
      description: Returns the profile data of the currently logged-in user.
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /items:
    get:
      tags:
        - Items
      summary: Browse and filter items
      description: Returns a paginated list of published items with optional search and category filters.
      operationId: listItems
      parameters:
        - name: query
          in: query
          description: Free-text search across item title and description
          required: false
          schema:
            type: string
        - name: category
          in: query
          description: Filter by item category
          required: false
          schema:
            type: string
        - name: condition
          in: query
          description: Filter by condition
          required: false
          schema:
            type: string
        - name: ownerId
          in: query
          description: Filter by owner user ID
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemListResponse'

    post:
      tags:
        - Items
      summary: Publish a new item
      description: Creates a new trade item associated with the authenticated user.
      operationId: createItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemDto'
      responses:
        '201':
          description: Item created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /items/me:
    get:
      tags:
        - Items
      summary: Get authenticated user's items
      description: Returns all barter items owned by the authenticated user.
      operationId: getMyItems
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of user items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /items/{id}:
    get:
      tags:
        - Items
      summary: Get item details
      description: Returns complete item profile by its unique ID.
      operationId: getItemById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Item found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '404':
          $ref: '#/components/responses/NotFoundError'

    patch:
      tags:
        - Items
      summary: Update an item
      description: Modifies item attributes. Only the owner can update the item.
      operationId: updateItem
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItemDto'
      responses:
        '200':
          description: Item updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      tags:
        - Items
      summary: Delete an item
      description: Removes an item from the catalog.
      operationId: deleteItem
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Item deleted successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /routes/find:
    post:
      tags:
        - Routes
      summary: Find circular barter routes
      description: Executes the circular graph BFS search algorithm to find exchange chains between offered and requested items.
      operationId: findRoutes
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindRoutesDto'
      responses:
        '200':
          description: List of discovered multi-swap routes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SwapRoute'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /routes/recommended:
    get:
      tags:
        - Routes
      summary: Get recommended swap routes
      description: Retrieves circular barter opportunities tailored to the authenticated user's current inventory and preferences.
      operationId: getRecommendedRoutes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of recommended routes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SwapRoute'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /routes/{id}:
    get:
      tags:
        - Routes
      summary: Get swap route by ID
      description: Returns full details, steps, chain participants, and CO2 savings for a specific swap route.
      operationId: getRouteById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Swap route details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapRoute'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /notifications:
    get:
      tags:
        - Notifications
      summary: List user notifications
      description: Returns all notifications for the authenticated user, optionally filtered by category.
      operationId: getNotifications
      security:
        - bearerAuth: []
      parameters:
        - name: filter
          in: query
          required: false
          description: Filter notifications by category
          schema:
            type: string
            enum: [all, swaps, system]
            default: all
      responses:
        '200':
          description: Array of user notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /notifications/read-all:
    patch:
      tags:
        - Notifications
      summary: Mark all notifications as read
      description: Updates read status for all unread notifications of the authenticated user.
      operationId: markAllNotificationsRead
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All notifications marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  updatedCount:
                    type: integer
                    example: 3
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /notifications/{id}/read:
    patch:
      tags:
        - Notifications
      summary: Mark notification as read
      description: Sets a single notification's unread status to false.
      operationId: markNotificationRead
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /proposals:
    get:
      tags:
        - Proposals
      summary: List barter proposals
      description: Returns proposals sent or received by the authenticated user.
      operationId: listProposals
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, accepted, declined, completed]
      responses:
        '200':
          description: List of proposals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Proposal'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags:
        - Proposals
      summary: Create exchange proposal
      description: Submits a direct or circuit barter proposal to another user.
      operationId: createProposal
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProposalDto'
      responses:
        '201':
          description: Proposal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter JWT Bearer token

  responses:
    BadRequestError:
      description: Invalid request parameters or payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Authentication is missing, invalid, or expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - uptime
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
          example: '2026-10-23T13:00:00Z'
        uptime:
          type: number
          example: 124.5
        version:
          type: string
          example: 1.0.0

    User:
      type: object
      required:
        - id
        - name
        - email
        - avatarUrl
        - rating
        - location
        - verified
        - co2SavedKg
      properties:
        id:
          type: string
          example: user-alex
        name:
          type: string
          example: Alex Morales
        email:
          type: string
          format: email
          example: alex.morales@correo.com
        avatarUrl:
          type: string
          example: /src/assets/avatar-alex.svg
        rating:
          type: number
          example: 4.9
        location:
          type: string
          example: Bogotá, Colombia
        verified:
          type: boolean
          example: true
        co2SavedKg:
          type: number
          example: 14.2
        createdAt:
          type: string
          format: date-time
          example: '2026-01-15T08:00:00Z'

    Item:
      type: object
      required:
        - id
        - name
        - category
        - condition
        - ownerId
        - imageUrl
        - wants
      properties:
        id:
          type: string
          example: item-bike-1
        name:
          type: string
          example: Bicicleta de Montaña Trek Marlin 7
        category:
          type: string
          example: Deportes
        condition:
          type: string
          example: Excelente estado
        ownerId:
          type: string
          example: user-alex
        imageUrl:
          type: string
          example: /src/assets/item-bike.svg
        wants:
          type: array
          items:
            type: string
          example: [item-ball-2, item-camera-5]
        description:
          type: string
          example: Bicicleta de montaña rin 29, frenos hidráulicos, 1x10 velocidades.
        estimatedValue:
          type: number
          example: 450
        createdAt:
          type: string
          format: date-time
          example: '2026-02-01T10:00:00Z'

    ItemListResponse:
      type: object
      required:
        - data
        - total
        - limit
        - offset
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        total:
          type: integer
          example: 42
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0

    CreateItemDto:
      type: object
      required:
        - name
        - category
        - condition
        - imageUrl
        - wants
      properties:
        name:
          type: string
          example: Nintendo Switch OLED
        category:
          type: string
          example: Videojuegos
        condition:
          type: string
          example: Como nuevo
        imageUrl:
          type: string
          example: /src/assets/item-switch.svg
        wants:
          type: array
          items:
            type: string
          example: [item-guitar-6]
        description:
          type: string
          example: Incluye 2 mandos Joy-Con y dock original.
        estimatedValue:
          type: number
          example: 300

    UpdateItemDto:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        condition:
          type: string
        imageUrl:
          type: string
        wants:
          type: array
          items:
            type: string
        description:
          type: string
        estimatedValue:
          type: number

    SwapStep:
      type: object
      required:
        - fromUserId
        - toUserId
        - fromItemId
        - toItemId
      properties:
        fromUserId:
          type: string
          example: user-alex
        toUserId:
          type: string
          example: user-carlos
        fromItemId:
          type: string
          example: item-bike-1
        toItemId:
          type: string
          example: item-ball-2

    SwapRoute:
      type: object
      required:
        - id
        - title
        - stepsCount
        - targetItemId
        - offeredItemId
        - participants
        - chainItems
        - co2SavedKg
        - isLoop
      properties:
        id:
          type: string
          example: route-1
        title:
          type: string
          example: Circuito de 4 pasos
        stepsCount:
          type: integer
          example: 4
        targetItemId:
          type: string
          example: item-camera-5
        offeredItemId:
          type: string
          example: item-bike-1
        participants:
          type: array
          items:
            $ref: '#/components/schemas/User'
        chainItems:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        co2SavedKg:
          type: number
          example: 18.5
        isLoop:
          type: boolean
          example: true

    FindRoutesDto:
      type: object
      required:
        - haveItemId
        - wantItemId
      properties:
        haveItemId:
          type: string
          example: item-bike-1
        wantItemId:
          type: string
          example: item-camera-5
        maxSwaps:
          type: integer
          default: 5
          example: 5
        maxRoutes:
          type: integer
          default: 3
          example: 3

    Proposal:
      type: object
      required:
        - id
        - targetItemId
        - offeredItemId
        - proposerUserId
        - recipientUserId
        - status
        - createdAt
      properties:
        id:
          type: string
          example: prop-101
        targetItemId:
          type: string
          example: item-camera-5
        offeredItemId:
          type: string
          example: item-bike-1
        proposerUserId:
          type: string
          example: user-alex
        recipientUserId:
          type: string
          example: user-sofia
        status:
          type: string
          enum: [pending, accepted, declined, completed]
          example: pending
        createdAt:
          type: string
          format: date-time
          example: '2026-10-23T11:30:00Z'

    CreateProposalDto:
      type: object
      required:
        - targetItemId
        - offeredItemId
        - recipientUserId
      properties:
        targetItemId:
          type: string
          example: item-camera-5
        offeredItemId:
          type: string
          example: item-bike-1
        recipientUserId:
          type: string
          example: user-sofia

    Notification:
      type: object
      required:
        - id
        - type
        - unread
        - icon
        - iconColor
        - iconBg
        - title
        - body
        - time
        - badge
      properties:
        id:
          type: string
          example: notif-1
        type:
          type: string
          enum: [proposal_accepted, new_route, proposal_received, proposal_declined, system]
          example: proposal_accepted
        unread:
          type: boolean
          example: true
        icon:
          type: string
          example: check_circle
        iconColor:
          type: string
          example: text-[#1a7a4a]
        iconBg:
          type: string
          example: bg-[#e8f5ee]
        title:
          type: string
          example: Carlos aceptó tu propuesta
        body:
          type: string
          example: Bicicleta Trek ↔ Balón FIFA — El intercambio puede continuar.
        time:
          type: string
          example: hace 5 min
        badge:
          type: string
          enum: [Canje, Ruta inteligente, Sistema]
          example: Canje
        badgeVariant:
          type: string
          example: secondary-subtle
        createdAt:
          type: string
          format: date-time
          example: '2026-10-23T12:55:00Z'

    RegisterDto:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: Alex Morales
        email:
          type: string
          format: email
          example: alex.morales@correo.com
        password:
          type: string
          format: password
          minLength: 8
          example: CircularEconomy2025!
        location:
          type: string
          example: Bogotá, Colombia

    LoginDto:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: alex.morales@correo.com
        password:
          type: string
          format: password
          example: CircularEconomy2025!

    RefreshTokenDto:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    TokenPair:
      type: object
      required:
        - accessToken
        - refreshToken
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expiresIn:
          type: integer
          example: 3600

    AuthResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - user
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/User'

    ErrorResponse:
      type: object
      required:
        - statusCode
        - message
        - error
        - timestamp
      properties:
        statusCode:
          type: integer
          example: 400
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: Validation failed
        error:
          type: string
          example: Bad Request
        timestamp:
          type: string
          format: date-time
          example: '2026-10-23T13:00:00Z'
